<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intent-Aware Data Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/styles.css" />
</head>

<body>

<header>
  <div class="logo">🧠 Intent-Aware Data Platform</div>
</header>

<main>

  <section class="card upload-card">
    <h2>📤 Upload Dataset</h2>

    <form id="uploadForm">
      <div class="field">
        <label>Select Dataset</label>
        <input type="file" name="file" required />
      </div>

      <div class="field">
        <label>Select Intent</label>
        <select name="intent">
          <option>REPORTING</option>
          <option>ML_TRAINING</option>
          <option>COMPLIANCE</option>
          <option>RESEARCH</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Run Pipeline</button>
    </form>

    <div id="loading" class="loading hidden">Processing… please wait</div>
  </section>

  <section class="grid">

    <div class="card">
      <h3>📄 Dataset Summary</h3>
      <pre id="summary" class="content-box">Upload a dataset to see summary.</pre>
    </div>

    <div class="card">
      <h3>💡 AI Business Insights</h3>
      <pre id="insights" class="content-box">Insights will appear here.</pre>
    </div>

  </section>

</main>


<!-- Chat Icon -->
<div id="chatIcon">💬</div>

<!-- Chat Panel -->
<div id="chatPanel" class="hidden">
  <div class="chat-header">
    AI Dataset Assistant
  </div>

  <div id="chatWindow" class="chat-window">
    <div class="bot">Hi 👋 — Ask me anything about your dataset.</div>
  </div>

  <div class="chat-input">
    <input id="question" placeholder="Type your question…" />
    <button onclick="ask()">Send</button>
  </div>
</div>


<script src="/static/script.js"></script>

</body>
</html>
